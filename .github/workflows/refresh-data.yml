name: Refresh Data from Databricks

# Pulls provider stats + campaign history into data/*-calc.json and data/*-dash.json,
# then refreshes investment-data/. Runs every Monday; also trigger manually from Actions.

on:
  schedule:
    # Monday 06:00 UTC (~07:00 Malta winter / 08:00 summer)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      countries:
        description: 'Optional country codes (comma-separated, e.g. mt,ro). Leave empty for all.'
        required: false
        default: ''

concurrency:
  group: refresh-databricks-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Databricks token
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          if [ -z "${DATABRICKS_TOKEN:-}" ]; then
            echo "::error::Missing repository secret DATABRICKS_TOKEN."
            echo "Add it under Settings → Secrets and variables → Actions (Databricks SQL warehouse PAT)."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Python 3.12 for Databricks Connect
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies + Connect worker venv
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python3.11 -m pip install databricks-sql-connector pandas pyarrow
          # Warehouse cannot autostart for this PAT — use serverless Spark Connect.
          python3.12 -m venv "$HOME/.venvs/dbx-connect"
          "$HOME/.venvs/dbx-connect/bin/pip" install -U pip
          "$HOME/.venvs/dbx-connect/bin/pip" install databricks-connect pandas pyarrow
          mkdir -p "$HOME/.databricks"
          printf '%s\n' '[DEFAULT]' \
            'host = https://bolt-incentives.cloud.databricks.com' \
            "token = ${DATABRICKS_TOKEN}" > "$HOME/.databrickscfg"
          echo "DBX_CONNECT_PYTHON=$HOME/.venvs/dbx-connect/bin/python" >> "$GITHUB_ENV"

      - name: Refresh calculator and AM dashboard JSON (data/)
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DBX_BACKEND: connect
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.countries }}" ]; then
            ARGS=$(echo "${{ github.event.inputs.countries }}" | tr ',' ' ')
          fi
          python3.11 scripts/refresh_data.py $ARGS

      - name: Refresh investment dashboard CSVs
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DBX_BACKEND: connect
        run: |
          # Non-fatal: must not block learn + Boltable deploy for AM spend tracker
          python3.11 scripts/refresh_investment_data.py || echo "investment refresh failed (non-fatal)"

      - name: Refresh CA budget envelopes (V2)
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DBX_BACKEND: connect
        run: |
          if [ -f scripts/refresh_budget_data.py ]; then
            ARGS=""
            if [ -n "${{ github.event.inputs.countries }}" ]; then
              ARGS=$(echo "${{ github.event.inputs.countries }}" | tr ',' ' ')
            fi
            python3.11 scripts/refresh_budget_data.py $ARGS || echo "budget refresh failed (non-fatal)"
          else
            echo "No refresh_budget_data.py — skip"
          fi

      - name: Rebuild peer cost benchmarks (V2)
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DBX_BACKEND: connect
        run: |
          if [ -f scripts/build_cost_benchmarks.py ]; then
            python3.11 scripts/build_cost_benchmarks.py || echo "benchmarks rebuild failed (non-fatal)"
          else
            echo "No build_cost_benchmarks.py — skip"
          fi

      - name: Learn from snapshots (V2)
        run: |
          if [ -f scripts/learn_from_snapshots.py ]; then
            python3.11 scripts/learn_from_snapshots.py || echo "learn_from_snapshots failed (non-fatal)"
          else
            echo "No learn_from_snapshots.py — skip"
          fi

      - name: Commit and push updated data (calc + dash + budget)
        id: commit_data
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # *-calc.json → Cost Calculator · *-dash.json → AM Spend · *-budget.json → V2 envelope
          git add data/ investment-data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto-refresh V2 calculator + spend + budget ($(date -u +%Y-%m-%d) UTC)"
            # Snapshot CI / other jobs may land on main while this run works
            git pull --rebase origin main
            git push
          fi

      # Live URL reads from boltable org repo. Needs secret BOLTABLE_DEPLOY_TOKEN
      # = classic PAT with repo scope, SSO-authorized for boltable org.
      # Always attempt when the job wasn't cancelled — even if calculator-repo push raced.
      - name: Deploy data to Boltable
        if: ${{ !cancelled() }}
        env:
          TOKEN: ${{ secrets.BOLTABLE_DEPLOY_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "Skipping Boltable deploy — add repo secret BOLTABLE_DEPLOY_TOKEN to enable."
            exit 0
          fi
          STAGE=$(mktemp -d)
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/boltable/food-campaign-calculator.git" "$STAGE"
          mkdir -p "$STAGE/public/data" "$STAGE/public/investment-data"
          cp -R data/. "$STAGE/public/data/"
          cp -R investment-data/. "$STAGE/public/investment-data/"
          rm -f "$STAGE/public/data/SHEETS_AND_SNAPSHOTS.md" "$STAGE/public/data/WEBHOOK_SETUP.md" 2>/dev/null || true
          cd "$STAGE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data public/investment-data
          if git diff --cached --quiet; then
            echo "Boltable already up to date."
          else
            git commit -m "Auto-refresh V2 calculator + spend + budget ($(date -u +%Y-%m-%d) UTC)"
            git push origin main
            echo "Boltable updated: https://food-campaign-calculator.boltable.eu"
          fi
