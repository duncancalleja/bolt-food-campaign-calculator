<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Malta Performance Hub</title>
  <style>
    :root {
      --bg: #0b1220;
      --bg2: #111a2e;
      --card: #162038;
      --card2: #1c2944;
      --border: #2a3a5c;
      --text: #e8eef9;
      --muted: #93a0b8;
      --accent: #4f8cff;
      --accent2: #7c5cff;
      --green: #22c55e;
      --yellow: #eab308;
      --amber: #f59e0b;
      --red: #ef4444;
      --green-bg: rgba(34,197,94,.15);
      --yellow-bg: rgba(234,179,8,.15);
      --amber-bg: rgba(245,158,11,.15);
      --red-bg: rgba(239,68,68,.15);
      --radius: 12px;
      --shadow: 0 8px 24px rgba(0,0,0,.35);
      --font: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
    body { min-height: 100vh; display: flex; flex-direction: column; }
    a { color: var(--accent); }
    .wrap { width: min(1280px, 100%); margin: 0 auto; padding: 0 1.25rem; }

    header.app-header {
      background: linear-gradient(135deg, #0f1b33 0%, #1a1040 55%, #0e2a4a 100%);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 0 0;
      position: sticky; top: 0; z-index: 40;
      backdrop-filter: blur(8px);
    }
    .brand-row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-start; justify-content: space-between; }
    .brand h1 { margin: 0; font-size: 1.45rem; letter-spacing: -.02em; }
    .brand p { margin: .35rem 0 0; color: var(--muted); font-size: .92rem; }
    .meta-pills { display: flex; flex-wrap: wrap; gap: .5rem; }
    .pill {
      background: rgba(255,255,255,.06); border: 1px solid var(--border);
      border-radius: 999px; padding: .35rem .75rem; font-size: .8rem; color: var(--muted);
    }
    .pill strong { color: var(--text); font-weight: 600; }

    nav.tabs {
      display: flex; gap: .25rem; margin-top: 1rem; overflow-x: auto;
      padding-bottom: 0; border-bottom: 1px solid transparent;
    }
    nav.tabs button {
      appearance: none; border: 0; background: transparent; color: var(--muted);
      padding: .75rem 1rem; font: inherit; font-weight: 600; font-size: .9rem;
      cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
    }
    nav.tabs button:hover { color: var(--text); }
    nav.tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
    nav.tabs button .tab-role { color: var(--muted); font-weight: 600; font-size: .7rem; margin-left: .3rem; }

    main { flex: 1; padding: 1.25rem 0 2rem; }
    .panel { display: none; animation: fade .2s ease; }
    .panel.active { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .grid { display: grid; gap: 1rem; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    @media (max-width: 1100px) { .grid-5 { grid-template-columns: repeat(3, minmax(0,1fr)); } }
    @media (max-width: 960px) {
      .grid-2, .grid-3, .grid-4, .grid-5 { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 640px) {
      .grid-2, .grid-3, .grid-4, .grid-5 { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1rem 1.1rem; box-shadow: var(--shadow);
    }
    .card h2, .card h3 { margin: 0 0 .75rem; font-size: 1rem; }
    .card .sub { color: var(--muted); font-size: .85rem; margin: -.4rem 0 .85rem; }

    .stat { text-align: left; }
    .stat .label { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
    .stat .value { font-size: 1.55rem; font-weight: 700; margin-top: .25rem; }
    .stat .hint { color: var(--muted); font-size: .8rem; margin-top: .2rem; }

    .status {
      display: inline-flex; align-items: center; gap: .35rem;
      border-radius: 999px; padding: .2rem .55rem; font-size: .78rem; font-weight: 700;
    }
    .status.green { background: var(--green-bg); color: var(--green); }
    .status.yellow { background: var(--yellow-bg); color: #facc15; }
    .status.amber { background: var(--amber-bg); color: var(--amber); }
    .status.red { background: var(--red-bg); color: #f87171; }
    .status.muted { background: rgba(255,255,255,.06); color: var(--muted); }

    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th, td { text-align: left; padding: .55rem .5rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .03em; position: sticky; top: 0; background: var(--card); z-index: 1; }
    tr:hover td { background: rgba(255,255,255,.02); }
    tfoot td { color: var(--muted); font-size: .82rem; border-bottom: 0; }
    .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    td.muted-cell { color: var(--muted); }
    .table-wrap { overflow: auto; max-height: 48vh; border-radius: 8px; }
    .table-wrap.tall { max-height: 62vh; }

    .toolbar { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; margin-bottom: 1rem; }
    .toolbar input, .toolbar select, .toolbar textarea, input, select, textarea {
      background: var(--bg2); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: .55rem .7rem; font: inherit;
    }
    .toolbar input[type="search"] { min-width: 220px; flex: 1; }
    .toolbar select { min-width: 160px; }
    .chip-row { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .85rem; }
    .chip {
      border: 1px solid var(--border); background: var(--bg2); color: var(--muted);
      border-radius: 999px; padding: .3rem .7rem; font-size: .78rem; cursor: pointer;
    }
    .chip.active { border-color: var(--accent); color: var(--text); background: rgba(79,140,255,.15); }
    .chip .n { font-weight: 700; color: var(--text); margin-left: .25rem; }
    .targetable { margin-top: .75rem; }
    .targetable .count-pills { display: flex; flex-wrap: wrap; gap: .45rem; margin: .55rem 0 .85rem; }
    .kpi-link {
      appearance: none; border: 0; border-bottom: 1px solid currentColor; background: transparent;
      color: var(--accent); padding: 0; font: inherit; font-weight: 700; cursor: pointer; text-align: left;
    }
    .kpi-link:hover, .kpi-link:focus-visible { color: #8bb4ff; }
    .account-drilldown {
      margin-top: 1rem; padding: .9rem; background: rgba(11,18,32,.45);
      border: 1px solid var(--border); border-radius: 10px;
    }
    [hidden] { display: none !important; }
    .tgt-cell { width: 5.5rem; text-align: center; }
    .am-comment-cell { min-width: 12rem; width: 16rem; }
    .am-comment { width: 100%; min-width: 0; padding: .4rem .5rem; font-size: .85rem; }
    .account-table { margin-top: 1.1rem; padding-top: .35rem; border-top: 1px solid var(--border); }
    .account-table .subhead h4 { color: var(--text); font-size: .9rem; }
    input[type="checkbox"] {
      width: 1.05rem; height: 1.05rem; min-width: 0; padding: 0; margin: 0;
      accent-color: var(--accent); cursor: pointer; vertical-align: middle;
    }
    .load-more { margin-top: .75rem; }

    .kpi-block { margin-bottom: 1rem; }
    .kpi-block > header {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: .5rem;
      align-items: baseline; margin-bottom: .85rem;
    }
    .kpi-block > header h3 { margin: 0; font-size: 1.05rem; }
    .boxes { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: .75rem; }
    @media (max-width: 900px) { .boxes { grid-template-columns: 1fr; } }
    .box {
      background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: .75rem;
    }
    .box label { display: block; font-size: .75rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-bottom: .4rem; }
    .box textarea {
      width: 100%; min-height: 6rem; resize: vertical; background: transparent; border: 0; color: var(--text);
      font: inherit; padding: 0; outline: none; line-height: 1.45;
    }
    .notes-row { margin-top: .75rem; }
    .notes-row label { display: block; font-size: .75rem; color: var(--muted); font-weight: 700; margin-bottom: .35rem; text-transform: uppercase; letter-spacing: .04em; }
    .notes-row textarea { width: 100%; min-height: 2.8rem; }
    .kpi-controls {
      display: grid; grid-template-columns: minmax(10rem, .3fr) minmax(18rem, 1fr);
      gap: .75rem; margin-top: .75rem;
    }
    .kpi-controls label { display: block; color: var(--muted); font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-bottom: .35rem; }
    .kpi-controls select, .kpi-controls textarea { width: 100%; }
    .kpi-controls textarea { min-height: 2.8rem; resize: vertical; }
    @media (max-width: 640px) { .kpi-controls { grid-template-columns: 1fr; } }

    .subhead {
      display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
      gap: .5rem; margin: 1rem 0 .5rem;
    }
    .subhead h4 { margin: 0; font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }

    .btn {
      appearance: none; border: 1px solid var(--border); background: var(--accent);
      color: white; font: inherit; font-weight: 600; font-size: .85rem;
      border-radius: 8px; padding: .5rem .85rem; cursor: pointer;
    }
    .btn.secondary { background: transparent; color: var(--text); }
    .btn.small { padding: .35rem .6rem; font-size: .8rem; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .toast {
      position: fixed; bottom: 1.25rem; right: 1.25rem; background: #12301f; color: #86efac;
      border: 1px solid #166534; padding: .65rem 1rem; border-radius: 10px; display: none; z-index: 50;
    }
    .toast.show { display: block; animation: fade .2s ease; }

    .list { margin: 0; padding-left: 1.1rem; color: var(--text); line-height: 1.55; }
    .list li { margin: .35rem 0; }

    footer.app-footer {
      border-top: 1px solid var(--border); color: var(--muted); font-size: .8rem;
      padding: 1rem 0 1.4rem; text-align: center;
    }
    .loading, .error { padding: 2rem; text-align: center; color: var(--muted); }
    .error { color: #fca5a5; }
    .legend { display: flex; flex-wrap: wrap; gap: .5rem; margin: .5rem 0 1rem; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="wrap">
      <div class="brand-row">
        <div class="brand">
          <h1>Malta Performance Hub</h1>
          <p>Overview plus one page per AM · KPIs are the Malta MM columns of the shared RAM sheet</p>
        </div>
        <div class="meta-pills" id="metaPills"></div>
      </div>
      <nav class="tabs" id="tabs" role="tablist"></nav>
    </div>
  </header>

  <main class="wrap">
    <div id="boot" class="loading">Loading hub data…</div>
    <div id="panels"></div>
  </main>

  <footer class="app-footer">
    <div class="wrap" id="footerText">Boltable static · unlisted</div>
  </footer>
  <div class="toast" id="toast">Saved to this browser</div>

  <script>
  const LS_KEY = 'mt-mm-performance-hub-v2';
  const TODAY = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Baku' });

  // The five KPI columns of the Malta MM scorecard in the shared RAM/KPI sheet.
  // Nothing outside this list is shown anywhere in the hub.
  const KPI_ORDER = ['Q3 Renegotiations', 'Sponsored Listings', 'Bolt Plus', 'Marketing Campaigns', 'Smart Promotions'];

  // Account-level targetable lists exist for Sponsored Listings, Marketing Campaigns and
  // Smart Promotions. Marketing Campaigns has no tried-before/history UI.
  const TARGETABLE_KPIS = ['Sponsored Listings', 'Marketing Campaigns', 'Smart Promotions'];
  const ACCOUNT_VIEW_KPIS = TARGETABLE_KPIS;
  const TARGETABLE_PAGE = 250;
  // Enrolled accounts (currentlyOn) and target accounts (everything else) are rendered as two
  // separate tables: an account that already has the product on has nothing left to target, so the
  // targeting checkbox and the targeting filter only exist on the target table.
  const TARGETING_MODES = [
    { key: 'all', label: 'All' },
    { key: 'targeting', label: 'Targeting' },
    { key: 'not', label: 'Not targeting' },
  ];

  // Pipeline owner mapping. Targetable JSON carries the Salesforce owner string, which has shown up
  // with accents, transliterations and short first names (Gülçin/Gulcin Ergüven, Yousef/Youssef/Yusuf
  // Moungad, Alena/Alyona/Elena Tokareva). Owner strings are normalised (lowercased, accents and
  // punctuation stripped) and matched against these aliases, with a surname fallback, so a spelling
  // change in the CRM export does not silently empty an AM's pipeline.
  const OWNER_ALIASES = {
    'Alena Tokareva': ['alena tokareva', 'alyona tokareva', 'elena tokareva', 'olena tokareva', 'tokareva'],
    'Rico Spagnol': ['rico spagnol', 'riccardo spagnol', 'enrico spagnol', 'spagnol'],
    'Yousef Moungad': ['yousef moungad', 'youssef moungad', 'yusuf moungad', 'yousef mounged', 'moungad'],
    'Gulcin Erguven': ['gulcin erguven', 'gulchin erguven', 'gulcin ergueven', 'erguven'],
    'Fiona Borg': ['fiona borg', 'borg fiona', 'fiona m borg'],
  };
  function normaliseName(s) {
    return String(s || '')
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toLowerCase().replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  function canonicalOwner(raw) {
    const n = normaliseName(raw);
    if (!n) return null;
    for (const [canonical, aliases] of Object.entries(OWNER_ALIASES)) {
      if (aliases.includes(n)) return canonical;
    }
    // Surname fallback: "Borg, Fiona", "F. Borg", middle names, etc.
    const tokens = new Set(n.split(' '));
    for (const [canonical, aliases] of Object.entries(OWNER_ALIASES)) {
      const surname = normaliseName(canonical).split(' ').pop();
      if (tokens.has(surname)) return canonical;
    }
    return null;
  }

  function pctClass(pct) {
    if (pct == null || Number.isNaN(Number(pct))) return 'muted';
    const p = Number(pct);
    if (p >= 1) return 'green';
    if (p >= 0.9) return 'yellow';
    if (p >= 0.7) return 'amber';
    return 'red';
  }
  function fmtPct(pct) {
    if (pct == null || pct === '') return '—';
    const p = Number(pct) * 100;
    // Keep a decimal when rounding would misleadingly show 100% for a sub-target number.
    if (p < 100 && Math.round(p) >= 100) return p.toFixed(1) + '%';
    return Math.round(p) + '%';
  }
  function fmtNum(n) {
    if (n == null || n === '') return '—';
    return Number(n).toLocaleString('en-GB');
  }
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function statusPill(pct) {
    return `<span class="status ${pctClass(pct)}">${fmtPct(pct)}</span>`;
  }
  function slug(name) {
    return normaliseName(name).split(' ')[0];
  }
  function accountViewId(person, kpi) {
    return `account-view-${normaliseName(person).replace(/\s+/g, '-')}-${normaliseName(kpi).replace(/\s+/g, '-')}`;
  }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg || 'Saved to this browser';
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.classList.remove('show'), 1600);
  }

  // Weekly notes and pipeline rows are stored per person + KPI, so two AMs working the same
  // KPI never overwrite each other and a page reset only clears that person's KPI blocks.
  function stateKey(person, kpi) { return `${person}||${kpi}`; }
  function loadState() {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); }
    catch { return {}; }
  }
  function saveState(state) { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  function getEntry(person, kpi) {
    const state = loadState();
    return state[stateKey(person, kpi)] || {};
  }
  function patchEntry(person, kpi, patch) {
    const state = loadState();
    const key = stateKey(person, kpi);
    state[key] = Object.assign({}, state[key], patch);
    saveState(state);
  }
  function clearPerson(person) {
    const state = loadState();
    Object.keys(state).forEach(k => { if (k.startsWith(person + '||')) delete state[k]; });
    saveState(state);
  }

  // Targeting ticks are keyed on provider + product + the account's AM, so a tick made on the
  // overview list shows up on that AM's page and an owner viewing another AM's list cannot
  // overwrite it. Accounts whose owner is outside the five AMs fall into one shared bucket.
  function targetingKey(product, row) {
    return `targeting||${product}||${canonicalOwner(row.owner) || 'unassigned'}||${row.providerId}`;
  }
  function isTargeting(state, product, row) { return Boolean(state[targetingKey(product, row)]); }
  // Only target-list rows carry a targeting checkbox, so enrolled accounts never count.
  function countTargeting(state, product, rows) {
    return rows.filter(r => !r.currentlyOn && isTargeting(state, product, r)).length;
  }

  // The scorecard "Targeted" cells live outside the target-list widget that owns the ticks, so the
  // rows behind each cell are registered here and every cell is repainted whenever a tick changes —
  // including a tick made on the overview list for another AM's account.
  const TARGETED_ROWS = new Map();
  function targetedRowsKey(person, product) { return `${person}||${product}`; }
  function refreshTargetedCounts() {
    const state = loadState();
    document.querySelectorAll('[data-targeted-cell]').forEach(cell => {
      const rows = TARGETED_ROWS.get(targetedRowsKey(cell.dataset.person, cell.dataset.product)) || [];
      cell.textContent = fmtNum(countTargeting(state, cell.dataset.product, rows));
    });
  }

  // Per-account AM comments sit on the target list only and are keyed the same way as
  // Targeting. Earlier builds stored them without the AM and under a "next step" name;
  // those keys are still read and are dropped once the AM saves over them.
  const LEGACY_COMMENT_PREFIXES = ['amComment', 'nextStep', 'next'];
  function commentKey(product, row) {
    return `amComment||${product}||${canonicalOwner(row.owner) || 'unassigned'}||${row.providerId}`;
  }
  function legacyCommentKeys(product, providerId) {
    return LEGACY_COMMENT_PREFIXES.map(p => `${p}||${product}||${providerId}`);
  }
  function readComment(state, product, row) {
    if (state[commentKey(product, row)]) return state[commentKey(product, row)];
    for (const key of legacyCommentKeys(product, row.providerId)) {
      if (state[key]) return state[key];
    }
    return '';
  }
  function writeComment(state, product, input) {
    const value = input.value.trim();
    if (value) state[input.dataset.commentKey] = value;
    else delete state[input.dataset.commentKey];
    legacyCommentKeys(product, input.dataset.provider).forEach(k => delete state[k]);
  }

  async function loadJSON(path) {
    const res = await fetch(path);
    if (!res.ok) throw new Error(`Failed to load ${path} (${res.status})`);
    return res.json();
  }

  function formatDate(value) {
    if (!value) return '—';
    const match = String(value).match(/^\d{4}-\d{2}-\d{2}/);
    return match ? match[0] : String(value);
  }

  function kpiPipelineCopy(value, kpi) {
    let text = String(value || '');
    if (TARGETABLE_KPIS.includes(kpi)) {
      text = text.replace(
        /^No account-level pull exists for [^—]+ — name the accounts, size, confidence and next step in the pipeline table below\./i,
        'Use the target list below. Set confidence and add an AM comment for the full KPI.'
      );
      text = text.replace(
        /Name this week's accounts in the pipeline table below and size them against/gi,
        'Use the target list below and size the full-KPI pipeline against'
      );
    } else {
      text = text.replace(
        / — name the accounts, size, confidence and next step in the pipeline table below\./gi,
        '. Set confidence and add an AM comment for the full KPI.'
      );
    }
    return text.replace(/\bnext step\b/gi, 'AM comment');
  }

  function targetableStats(rows) {
    return {
      all: rows.length,
      current: rows.filter(r => r.currentlyOn).length,
      pipeline: rows.filter(r => !r.currentlyOn).length,
      never: rows.filter(r => !r.everHadOn).length,
      tried: rows.filter(r => r.everHadOn && !r.currentlyOn).length,
    };
  }

  function bucketByOwner(rows, people) {
    const map = new Map(people.map(p => [p.name, []]));
    rows.forEach(row => {
      const owner = canonicalOwner(row.owner);
      if (owner && map.has(owner)) map.get(owner).push(row);
    });
    map.forEach(list => list.sort((a, b) => String(a.accountName || '').localeCompare(String(b.accountName || ''))));
    return map;
  }

  /* ---------------------------------------------------------------- overview */

  function renderOverview(hub, people, slByOwner, spByOwner, mcByOwner, slAll, spAll, mcAll) {
    const kpis = hub.countryKpis || [];
    const scorecard = hub.scorecard || [];

    const kpiCards = kpis.map(k => `
        <div class="card stat">
          <div class="label">${esc(k.kpi)}</div>
          <div class="value">${statusPill(k.pct)}</div>
          <div class="hint">${fmtNum(k.achievement)} / ${fmtNum(k.target)} · gap ${fmtNum(k.gap)}</div>
        </div>`).join('');

    const rowFor = (person, kpi) => scorecard.find(r => r.person === person && r.kpi === kpi);
    const overallFor = person => {
      const rows = KPI_ORDER.map(k => rowFor(person, k)).filter(Boolean);
      if (!rows.length) return null;
      return rows.reduce((s, r) => s + Math.min(Number(r.pct || 0), 1), 0) / rows.length;
    };

    const matrixRows = people.map(p => `
      <tr>
        <td><strong>${esc(p.name)}</strong><div class="hint">${esc(p.role)}</div></td>
        ${KPI_ORDER.map(k => {
          const r = rowFor(p.name, k);
          if (!r) return '<td>—</td>';
          return `<td>${statusPill(r.pct)}<div class="hint num">${fmtNum(r.achievement)} / ${fmtNum(r.target)}</div></td>`;
        }).join('')}
        <td>${statusPill(overallFor(p.name))}</td>
      </tr>`).join('');

    const countryRow = `
      <tr>
        <td><strong>Country overview</strong><div class="hint">Country KPI target · roll-up of the 5 AMs</div></td>
        ${KPI_ORDER.map(k => {
          const c = kpis.find(x => x.kpi === k);
          if (!c) return '<td>—</td>';
          return `<td>${statusPill(c.pct)}<div class="hint num">${fmtNum(c.achievement)} / ${fmtNum(c.target)}</div></td>`;
        }).join('')}
        <td>${statusPill(kpis.reduce((s, c) => s + Math.min(Number(c.pct || 0), 1), 0) / (kpis.length || 1))}</td>
      </tr>`;

    const gapRows = kpis.map(k => {
      const contributors = people
        .map(p => ({ name: p.name, gap: rowFor(p.name, k.kpi)?.gap ?? 0, pct: rowFor(p.name, k.kpi)?.pct }))
        .filter(x => x.gap > 0)
        .sort((a, b) => b.gap - a.gap);
      const worst = contributors.length
        ? contributors.map(c => `${c.name.split(' ')[0]} ${fmtNum(c.gap)} (${fmtPct(c.pct)})`).join(' · ')
        : 'No AM behind target';
      return `
        <tr>
          <td><strong>${esc(k.kpi)}</strong></td>
          <td>${statusPill(k.pct)}</td>
          <td class="num">${fmtNum(k.achievement)} / ${fmtNum(k.target)}</td>
          <td class="num">${fmtNum(k.gap)}</td>
          <td>${esc(worst)}</td>

    const ownerSummary = (byOwner, showHistory = true) => {
      const rows = people.map(p => {

        return `
          <tr>
            <td><strong>${esc(p.name)}</strong></td>

      }).join('');
      const totals = targetableStats(people.flatMap(p => byOwner.get(p.name) || []));
      return `${rows}
        <tr>
          <td><strong>Five AMs</strong></td>
          <td class="num">${fmtNum(totals.all)}</td>
          <td class="num">${fmtNum(totals.current)}</td>
          <td class="num">${fmtNum(totals.pipeline)}</td>
          ${showHistory ? `<td class="num">${fmtNum(totals.never)}</td>
          <td class="num">${fmtNum(totals.tried)}</td>` : ''}
        </tr>`;
    };
    const slStats = targetableStats(slAll);
    const spStats = targetableStats(spAll);
    const mcStats = targetableStats(mcAll);
    const reqs = hub.kpiRequirements || [];

    return `
      <div class="card" style="margin-bottom:1rem">
        <h2>Malta Performance Hub · ${esc(hub.month || '')}</h2>
        <p class="sub">${esc(hub.scope || '')}</p>
        <div class="legend">
          <span class="status green">≥100%</span>
          <span class="status yellow">≥90%</span>
          <span class="status amber">≥70%</span>
          <span class="status red">&lt;70%</span>
        </div>
      </div>

      <div class="card" style="margin-bottom:1rem">
        <div class="brand-row">
          <div>
            <h2 style="margin:0 0 .25rem">Country KPI target</h2>
            <p class="sub" style="margin:0">The five Malta MM KPI targets at country level. This is a country overview, not an individual owner.</p>
          </div>
          <div class="meta-pills">
            <span class="pill"><strong>Country overview</strong></span>
            <span class="pill">Malta</span>
          </div>
        </div>
      </div>

      <div class="grid grid-5" style="margin-bottom:1rem">${kpiCards}</div>

      <div class="card" style="margin-bottom:1rem">
        <h2>Team scorecard roll-up</h2>
        <p class="sub">The five RAM sheet KPIs across the five AMs, with the country KPI target as the bottom row. Overall is the average attainment, capped at 100% per KPI.</p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Owner</th>${KPI_ORDER.map(k => `<th>${esc(k)}</th>`).join('')}<th>Overall</th></tr></thead>
            <tbody>${matrixRows}${countryRow}</tbody>
          </table>
        </div>
      </div>

      <div class="card" style="margin-bottom:1rem">
        <h2>Weekly country gaps · week of ${esc(hub.weekOf || '')}</h2>
        <p class="sub">The country KPI target versus the AMs carrying each gap. Open an AM page for the root cause, pipeline and forecast.</p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>KPI</th><th>%</th><th>Ach. / target</th><th>Gap</th><th>AMs behind target</th></tr></thead>
            <tbody>${gapRows}</tbody>
          </table>
        </div>
      </div>

      <div class="grid grid-3" style="margin-bottom:1rem">
        <div class="card stat"><div class="label">SL already enrolled</div><div class="value">${fmtNum(slStats.current)}</div><div class="hint">Of ${fmtNum(slStats.all)} active Malta providers</div></div>
        <div class="card stat"><div class="label">SL target list</div><div class="value">${fmtNum(slStats.pipeline)}</div><div class="hint">${fmtNum(slStats.never)} never tried · ${fmtNum(slStats.tried)} tried before</div></div>
        <div class="card stat"><div class="label">SP already enrolled</div><div class="value">${fmtNum(spStats.current)}</div><div class="hint">Of ${fmtNum(spStats.all)} active Malta providers</div></div>
        <div class="card stat"><div class="label">SP target list</div><div class="value">${fmtNum(spStats.pipeline)}</div><div class="hint">${fmtNum(spStats.never)} never tried · ${fmtNum(spStats.tried)} tried before</div></div>
        <div class="card stat"><div class="label">MC already enrolled</div><div class="value">${fmtNum(mcStats.current)}</div><div class="hint">Of ${fmtNum(mcStats.all)} Malta accounts</div></div>
        <div class="card stat"><div class="label">MC target list</div><div class="value">${fmtNum(mcStats.pipeline)}</div><div class="hint">Not enrolled today</div></div>
      </div>

      <div class="card" style="margin-bottom:1rem">
        <h2>Sponsored Listings by AM</h2>

          <table>

  /* --------------------------------------------------------------- AM pages */

  function kpiBlockHtml(person, w, slRows, spRows, mcRows) {
    const entry = getEntry(person, w.kpi);
    const rootCause = entry.rootCause ?? w.rootCause ?? '';
    const pipelineText = kpiPipelineCopy(entry.pipeline ?? w.pipeline ?? '', w.kpi);
    const forecast = entry.forecast ?? w.forecast ?? '';
    const notes = entry.notes ?? w.notes ?? '';
    const legacyRow = Array.isArray(entry.rows) ? entry.rows[0] : null;
    const confidence = entry.confidence ?? legacyRow?.confidence ?? '';
    const amComment = entry.amComment ?? entry.nextStep ?? legacyRow?.amComment ?? legacyRow?.nextStep ?? '';
    const confidenceOptions = ['', 'High', 'Medium', 'Low']
      .map(c => `<option value="${c}"${c === confidence ? ' selected' : ''}>${c || '—'}</option>`).join('');
    const targetableRows = w.kpi === 'Sponsored Listings' ? slRows
      : w.kpi === 'Smart Promotions' ? spRows
      : w.kpi === 'Marketing Campaigns' ? mcRows
      : [];
    const hasAccountView = ACCOUNT_VIEW_KPIS.includes(w.kpi);
    const targetable = hasAccountView
      ? `<div class="account-drilldown" id="${esc(accountViewId(person, w.kpi))}" data-account-view hidden>
          ${targetableHtml(person, w.kpi, targetableRows)}
        </div>`
      : '';

    return `
      <div class="card kpi-block" data-person="${esc(person)}" data-kpi="${esc(w.kpi)}" data-gap="${esc(w.gap ?? 0)}">
        <header>
          <h3>${esc(w.kpi)}</h3>
          <div class="meta-pills">
            <span class="pill">Ach. <strong>${fmtNum(w.achievement)}</strong></span>
            <span class="pill">Target <strong>${fmtNum(w.target)}</strong></span>
            <span class="pill">Gap <strong>${fmtNum(w.gap)}</strong></span>
            ${statusPill(w.pct)}
          </div>
        </header>
        <div class="boxes">
          <div class="box">
            <label>Root cause</label>
            <textarea data-field="rootCause" placeholder="Specific execution reason…">${esc(rootCause)}</textarea>
          </div>
          <div class="box">
            <label>Pipeline</label>
            <textarea data-field="pipeline" placeholder="Full-KPI pipeline and plan against the gap…">${esc(pipelineText)}</textarea>
          </div>
          <div class="box">
            <label>Forecast</label>
            <textarea data-field="forecast" placeholder="Honest EOW/EOM landing…">${esc(forecast)}</textarea>
          </div>
        </div>
        <div class="kpi-controls">
          <div>
            <label for="${esc(accountViewId(person, w.kpi))}-confidence">Confidence</label>
            <select id="${esc(accountViewId(person, w.kpi))}-confidence" data-field="confidence">${confidenceOptions}</select>
          </div>
          <div>
            <label for="${esc(accountViewId(person, w.kpi))}-comment">AM comment</label>
            <textarea id="${esc(accountViewId(person, w.kpi))}-comment" data-field="amComment" placeholder="AM comment for this KPI…">${esc(amComment)}</textarea>
          </div>
        </div>
        ${hasAccountView ? '' : '<p class="sub" style="margin:.75rem 0 0">Enrolled and target lists are on Sponsored Listings, Marketing Campaigns and Smart Promotions.</p>'}
        <div class="notes-row">
          <label>Notes</label>
          <textarea data-field="notes" placeholder="Optional notes…">${esc(notes)}</textarea>
        </div>
        ${targetable}
      </div>`;
  }

  function targetableHtml(scope, product, rows, opts = {}) {

    const showHistory = product !== 'Marketing Campaigns';
    const ownerOptions = opts.ownerFilter
      ? `<select data-target-owner>
          <option value="">All owners</option>
          ${Object.keys(OWNER_ALIASES).map(name => `<option value="${esc(name)}">${esc(name)}</option>`).join('')}
        </select>`
      : '';
    return `
      <div class="targetable" data-product="${esc(product)}" data-scope="${esc(scope)}">
        <div class="subhead">
          <h4>${esc(product)} accounts</h4>
        </div>
        <p class="sub" style="margin:.15rem 0 .75rem">${opts.ownerFilter
          ? 'Use the owner filter to focus both tables on one AM.'
          : `Filtered to ${esc(first)}'s accounts using the existing owner alias map.`}</p>
        <div class="toolbar">
          <input type="search" data-target-search placeholder="Search account name…" />
          ${ownerOptions}
          <span class="pill">Search and owner apply to both tables</span>
        </div>

        <section class="account-table" data-list="enrolled">
          <div class="subhead">
            <h4>Already enrolled</h4>
            <span class="pill" data-enrolled-shown>Showing 0</span>
          </div>
          <p class="sub" style="margin:.15rem 0 .75rem">Already on ${esc(product)} — nothing to target here.</p>
          <div class="table-wrap">
            <table>
              <thead><tr>
                <th>Account</th><th>Provider ID</th>${showHistory ? '<th>First start</th><th>Current end</th>' : ''}
              </tr></thead>
              <tbody data-enrolled-body></tbody>
            </table>
          </div>
          <button type="button" class="btn secondary small load-more" data-action="load-more" data-list="enrolled">Show next ${fmtNum(TARGETABLE_PAGE)}</button>
        </section>

        <section class="account-table" data-list="target">
          <div class="subhead">
            <h4>Target list</h4>
            <span class="pill" data-target-shown>Showing 0</span>
          </div>
          <p class="sub" style="margin:.15rem 0 .75rem">Not on ${esc(product)} today — the only accounts that can be targeted. Tick Targeting and add an AM comment per account.</p>
          ${showHistory ? `<div class="count-pills">
            <span class="pill">Never tried <strong data-stat="never">0</strong></span>
            <span class="pill">Tried before <strong data-stat="tried">0</strong></span>

          <div class="chip-row" data-targeting-filters aria-label="Targeting filter">
            ${TARGETING_MODES.map((m, i) => `<button type="button" class="chip${i === 0 ? ' active' : ''}" data-targeting-mode="${m.key}">${esc(m.label)}</button>`).join('')}
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr>
                <th>Targeting</th><th>AM comment</th><th>Account</th><th>Provider ID</th>${showHistory ? '<th>History</th><th>First start</th><th>Last end</th>' : ''}
              </tr></thead>
              <tbody data-target-body></tbody>
            </table>
          </div>
          <button type="button" class="btn secondary small load-more" data-action="load-more" data-list="target">Show next ${fmtNum(TARGETABLE_PAGE)}</button>
        </section>
      </div>`;
  }

  function renderPerson(hub, person, role, slRows, spRows, mcRows) {
    const weekly = (hub.weeklyPerformance || []).filter(w => w.person === person);
    const ordered = KPI_ORDER.map(k => weekly.find(w => w.kpi === k)).filter(Boolean);
    const scorecard = (hub.scorecard || []).filter(r => r.person === person);
    const overall = scorecard.length
      ? scorecard.reduce((s, r) => s + Math.min(Number(r.pct || 0), 1), 0) / scorecard.length
      : null;
    const slStats = targetableStats(slRows);
    const spStats = targetableStats(spRows);
    const mcStats = targetableStats(mcRows);
    TARGETED_ROWS.set(targetedRowsKey(person, 'Sponsored Listings'), slRows);
    TARGETED_ROWS.set(targetedRowsKey(person, 'Smart Promotions'), spRows);
    TARGETED_ROWS.set(targetedRowsKey(person, 'Marketing Campaigns'), mcRows);

    const state = loadState();
    const scoreRows = KPI_ORDER.map(k => {
      const r = scorecard.find(x => x.kpi === k);
      if (!r) return '';
      const canDrillDown = ACCOUNT_VIEW_KPIS.includes(r.kpi);
      const kpiName = canDrillDown
        ? `<button type="button" class="kpi-link" data-action="open-account-view" data-kpi="${esc(r.kpi)}" aria-controls="${esc(accountViewId(person, r.kpi))}" aria-expanded="false">${esc(r.kpi)}</button>`
        : `<strong>${esc(r.kpi)}</strong>`;
      // A KPI without a target list has no targeting UI at all, so it shows a dash rather than a 0.
      const targetRows = r.kpi === 'Sponsored Listings' ? slRows
        : r.kpi === 'Smart Promotions' ? spRows
        : r.kpi === 'Marketing Campaigns' ? mcRows
        : null;
      const targetedCell = targetRows
        ? `<td class="num" data-targeted-cell data-person="${esc(person)}" data-product="${esc(r.kpi)}" title="Accounts ticked as Targeting on the ${esc(r.kpi)} target list">${fmtNum(countTargeting(state, r.kpi, targetRows))}</td>`
        : '<td class="num muted-cell" title="No target list for this KPI">—</td>';
      return `
        <tr>
          <td>${kpiName}</td>
          <td class="num">${fmtNum(r.achievement)}</td>
          <td class="num">${fmtNum(r.target)}</td>
          <td>${statusPill(r.pct)}</td>
          <td class="num">${fmtNum(r.gap)}</td>
          ${targetedCell}
          <td>${esc(r.status || '')}</td>
        </tr>`;
    }).join('');

    return `
      <div class="card" style="margin-bottom:1rem">
        <div class="brand-row">
          <div>
            <h2 style="margin:0 0 .25rem">${esc(person)} · ${esc(role)}</h2>
            <p class="sub" style="margin:0">Scorecard for ${esc(hub.month || '')} · week of ${esc(hub.weekOf || '')} · overall ${fmtPct(overall)} (capped average)</p>
          </div>
          <div class="meta-pills">
            ${statusPill(overall)}
            <span class="pill">SL enrolled <strong>${fmtNum(slStats.current)}</strong> · target <strong>${fmtNum(slStats.pipeline)}</strong></span>
            <span class="pill">SP enrolled <strong>${fmtNum(spStats.current)}</strong> · target <strong>${fmtNum(spStats.pipeline)}</strong></span>
            <span class="pill">MC enrolled <strong>${fmtNum(mcStats.current)}</strong> · target <strong>${fmtNum(mcStats.pipeline)}</strong></span>
          </div>
        </div>
        <div class="table-wrap" style="margin-top:.85rem">
          <table>
            <thead><tr><th>KPI</th><th>Ach.</th><th>Target</th><th>%</th><th>Gap</th><th title="Accounts ticked as Targeting on that KPI's target list">Targeted</th><th>Status</th></tr></thead>
            <tbody>${scoreRows}</tbody>
          </table>
        </div>
        <div class="toolbar" style="margin:.85rem 0 0">
          <button type="button" class="btn" data-action="copy-update">Copy weekly update</button>
          <button type="button" class="btn secondary" data-action="reset-person">Reset this page to pack defaults</button>
          <span class="pill">KPI notes, confidence, comments and targeting save to this browser</span>
        </div>
      </div>
      ${ordered.map(w => kpiBlockHtml(person, w, slRows, spRows, mcRows)).join('')}`;
  }

  function wireTargetable(widget, rows) {
    const product = widget.dataset.product;
    const targetingFilters = widget.querySelector('[data-targeting-filters]');
    const search = widget.querySelector('[data-target-search]');
    const ownerSel = widget.querySelector('[data-target-owner]');
    const enrolledShown = widget.querySelector('[data-enrolled-shown]');
    const targetShown = widget.querySelector('[data-target-shown]');
    const enrolledBody = widget.querySelector('[data-enrolled-body]');
    const targetBody = widget.querySelector('[data-target-body]');
    const enrolledMore = widget.querySelector('[data-action="load-more"][data-list="enrolled"]');
    const targetMore = widget.querySelector('[data-action="load-more"][data-list="target"]');
    let targetingMode = 'all';
    let limits = { enrolled: TARGETABLE_PAGE, target: TARGETABLE_PAGE };

    const scopedRows = () => {
      const query = (search.value || '').trim().toLowerCase();
      const owner = ownerSel?.value || '';
      return rows.filter(r =>
        (!owner || canonicalOwner(r.owner) === owner) &&
        (!query || String(r.accountName || '').toLowerCase().includes(query)));
    };

    const paint = () => {
      const state = loadState();
      const scoped = scopedRows();
      const stats = targetableStats(scoped);
      widget.querySelectorAll('[data-stat]').forEach(el => {
        el.textContent = fmtNum(stats[el.dataset.stat]);
      });

      const enrolled = scoped.filter(r => r.currentlyOn);
      const enrolledVisible = enrolled.slice(0, limits.enrolled);
      enrolledShown.textContent = `Showing ${fmtNum(enrolledVisible.length)} of ${fmtNum(enrolled.length)} enrolled`;
      if (enrolledMore) enrolledMore.hidden = enrolledVisible.length >= enrolled.length;
      enrolledBody.innerHTML = enrolledVisible.map(r => `
          <tr>
            <td><strong>${esc(r.accountName)}</strong></td>
            <td class="num">${esc(r.providerId)}</td>
            ${product !== 'Marketing Campaigns' ? `<td class="num">${esc(formatDate(r.firstStart))}</td>
            <td class="num">${esc(formatDate(r.lastEnd))}</td>` : ''}
          </tr>`).join('') || `<tr><td colspan="${product === 'Marketing Campaigns' ? 2 : 4}" style="color:var(--muted)">No enrolled accounts</td></tr>`;

      const targets = scoped.filter(r => !r.currentlyOn);
      const matches = targets.filter(r =>
        targetingMode === 'all' || isTargeting(state, product, r) === (targetingMode === 'targeting'));
      const targetVisible = matches.slice(0, limits.target);
      const targetingCount = targets.filter(r => isTargeting(state, product, r)).length;
      targetShown.textContent =
        `Showing ${fmtNum(targetVisible.length)} of ${fmtNum(matches.length)} · ${fmtNum(targetingCount)} targeting`;
      if (targetMore) targetMore.hidden = targetVisible.length >= matches.length;
      targetBody.innerHTML = targetVisible.map(r => `
          <tr>
            <td class="tgt-cell"><input type="checkbox" data-targeting-key="${esc(targetingKey(product, r))}"${
              isTargeting(state, product, r) ? ' checked' : ''
            } aria-label="Targeting ${esc(r.accountName)}" /></td>
            <td class="am-comment-cell"><input class="am-comment" data-comment-key="${esc(commentKey(product, r))}" data-provider="${esc(r.providerId)}" value="${
              esc(readComment(state, product, r))
            }" placeholder="AM comment…" aria-label="AM comment for ${esc(r.accountName)}" autocomplete="off" /></td>
            <td><strong>${esc(r.accountName)}</strong></td>
            <td class="num">${esc(r.providerId)}</td>
            ${product !== 'Marketing Campaigns' ? `<td>${r.everHadOn
              ? '<span class="status yellow">Tried before</span>'
              : '<span class="status muted">Never tried</span>'}</td>
            <td class="num">${esc(formatDate(r.firstStart))}</td>
            <td class="num">${esc(formatDate(r.lastEnd))}</td>` : ''}
          </tr>`).join('') || `<tr><td colspan="${product === 'Marketing Campaigns' ? 4 : 7}" style="color:var(--muted)">No matching accounts</td></tr>`;
    };

    const resetLimits = () => { limits = { enrolled: TARGETABLE_PAGE, target: TARGETABLE_PAGE }; };

    targetingFilters.addEventListener('click', e => {
      const chip = e.target.closest('[data-targeting-mode]');
      if (!chip) return;
      targetingMode = chip.dataset.targetingMode;
      limits.target = TARGETABLE_PAGE;
      targetingFilters.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
      paint();
    });
    search.addEventListener('input', () => { resetLimits(); paint(); });
    ownerSel?.addEventListener('change', () => { resetLimits(); paint(); });
    widget.querySelectorAll('[data-action="load-more"]').forEach(btn => {
      btn.addEventListener('click', () => { limits[btn.dataset.list] += TARGETABLE_PAGE; paint(); });
    });
    targetBody.addEventListener('change', e => {
      const box = e.target.closest('input[data-targeting-key]');
      if (box) {
        const state = loadState();
        if (box.checked) state[box.dataset.targetingKey] = true;
        else delete state[box.dataset.targetingKey];
        saveState(state);
        refreshTargetedCounts();
        showToast(box.checked ? 'Marked as targeting' : 'Targeting cleared');
        // A tick can drop the row out of the current view, so only repaint when it filters.
        if (targetingMode !== 'all') paint();
        else targetingCountOnly(state);
        return;
      }
      if (e.target.closest('input[data-comment-key]')) showToast('AM comment saved');
    });
    // Saving on input keeps the comment even when the row is repainted before blur.
    targetBody.addEventListener('input', e => {
      const input = e.target.closest('input[data-comment-key]');
      if (!input) return;
      const state = loadState();
      writeComment(state, product, input);
      saveState(state);
    });

    // Keeping the "N targeting" count live without rebuilding rows, so a tick never steals focus.
    function targetingCountOnly(state) {
      const count = countTargeting(state, product, scopedRows());
      targetShown.textContent = targetShown.textContent.replace(/[\d,]+ targeting$/, `${fmtNum(count)} targeting`);
    }

    paint();
  }

  /* ------------------------------------------------------------- behaviour */

  function wirePerson(panel, hub, person, slRows, spRows, mcRows) {
    // A reset re-renders the panel in place, so drop the previous listeners first.
    panel._listeners?.abort();
    const { signal } = (panel._listeners = new AbortController());

    const persistBlock = block => {
      const kpi = block.dataset.kpi;
      const patch = {};
      block.querySelectorAll('[data-field]').forEach(el => { patch[el.dataset.field] = el.value; });
      patchEntry(person, kpi, patch);
    };

    let saveTimer;
    panel.addEventListener('input', e => {
      const block = e.target.closest('.kpi-block');
      if (!block) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => persistBlock(block), 400);
    }, { signal });
    panel.addEventListener('change', e => {
      const block = e.target.closest('.kpi-block');
      if (block) persistBlock(block);
    }, { signal });

    panel.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const block = btn.closest('.kpi-block');

      if (btn.dataset.action === 'open-account-view') {
        const targetBlock = Array.from(panel.querySelectorAll('.kpi-block'))
          .find(candidate => candidate.dataset.kpi === btn.dataset.kpi);
        const accountView = targetBlock?.querySelector('[data-account-view]');
        if (accountView) {
          panel.querySelectorAll('[data-account-view]').forEach(view => { view.hidden = view !== accountView; });
          accountView.hidden = false;
          panel.querySelectorAll('[data-action="open-account-view"]').forEach(link => {
            link.setAttribute('aria-expanded', String(link === btn));
          });
          accountView.scrollIntoView({ behavior: 'smooth', block: 'start' });
          accountView.querySelector('[data-target-search]')?.focus({ preventScroll: true });
        }
        return;
      }

      if (btn.dataset.action === 'reset-person') {
        clearPerson(person);
        renderPersonPanel(panel, hub, person, panel.dataset.role, slRows, spRows, mcRows);
        showToast('Reset to pack defaults');
        return;
      }
      if (btn.dataset.action === 'copy-update') {
        const text = buildUpdateText(hub, person, panel);
        navigator.clipboard?.writeText(text).then(
          () => showToast('Weekly update copied'),
          () => showToast('Copy blocked by browser')
        );
      }
    }, { signal });

    // Account views exist for Sponsored Listings, Marketing Campaigns and Smart Promotions.
    panel.querySelectorAll('.targetable').forEach(widget => {
      const product = widget.dataset.product;
      const source = product === 'Sponsored Listings' ? slRows
        : product === 'Smart Promotions' ? spRows
        : product === 'Marketing Campaigns' ? mcRows
        : [];
      wireTargetable(widget, source);
    });
  }

  function buildUpdateText(hub, person, panel) {
    const lines = [`${person} · Malta Performance Hub · week of ${hub.weekOf || ''}`];
    panel.querySelectorAll('.kpi-block').forEach(block => {
      const kpi = block.dataset.kpi;
      const val = f => (block.querySelector(`textarea[data-field="${f}"]`)?.value || '').trim();
      const confidence = block.querySelector('[data-field="confidence"]')?.value || '—';
      lines.push('', `## ${kpi} — gap ${block.dataset.gap}`);
      lines.push(`Root cause: ${val('rootCause')}`);
      lines.push(`Pipeline: ${val('pipeline')}`);
      lines.push(`Forecast: ${val('forecast')}`);
      lines.push(`Confidence: ${confidence}`);
      const amComment = val('amComment');
      if (amComment) lines.push(`AM comment: ${amComment}`);
      const notes = val('notes');
      if (notes) lines.push(`Notes: ${notes}`);
    });
    return lines.join('\n');
  }

  function renderPersonPanel(panel, hub, person, role, slRows, spRows, mcRows) {
    panel.innerHTML = renderPerson(hub, person, role, slRows, spRows, mcRows);
    wirePerson(panel, hub, person, slRows, spRows, mcRows);
  }

  function activateTab(name) {
    document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('#panels .panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
    history.replaceState(null, '', '#' + name);
    window.scrollTo({ top: 0 });
  }

  async function main() {
    try {
      const [hub, slTargetable, spTargetable, mcData] = await Promise.all([
        loadJSON('data/malta-mm/hub-data.json'),
        loadJSON('data/malta-mm/sl-targetable.json'),
        loadJSON('data/malta-mm/sp-targetable.json'),
        loadJSON('data/malta-mm/mc-targetable.json'),
      ]);
      const mcTargetable = mcData.rows || [];

      const people = (hub.team || []).filter(t => OWNER_ALIASES[t.name]);
      const slByOwner = bucketByOwner(slTargetable, people);
      const spByOwner = bucketByOwner(spTargetable, people);
      const mcByOwner = bucketByOwner(mcTargetable, people);
      const slCountryStats = targetableStats(slTargetable);
      const spCountryStats = targetableStats(spTargetable);
      const mcCountryStats = targetableStats(mcTargetable);

      document.getElementById('boot').remove();

      const asOf = TODAY;
      document.getElementById('metaPills').innerHTML = `
        <span class="pill">Month <strong>${esc(hub.month || '')}</strong></span>
        <span class="pill">Week of <strong>${esc(hub.weekOf || '')}</strong></span>
        <span class="pill">AMs <strong>${people.length}</strong></span>
        <span class="pill">Country KPI target <strong>Overview</strong></span>
        <span class="pill">SL enrolled <strong>${fmtNum(slCountryStats.current)}</strong> · target <strong>${fmtNum(slCountryStats.pipeline)}</strong></span>
        <span class="pill">SP enrolled <strong>${fmtNum(spCountryStats.current)}</strong> · target <strong>${fmtNum(spCountryStats.pipeline)}</strong></span>
        <span class="pill">MC enrolled <strong>${fmtNum(mcCountryStats.current)}</strong> · target <strong>${fmtNum(mcCountryStats.pipeline)}</strong></span>
        <span class="pill">Data as of <strong>${esc(asOf)}</strong></span>`;
      document.getElementById('footerText').textContent =
        `Boltable static · mt-mm-performance · unlisted · data as of ${asOf} · opened ${TODAY} Asia/Baku`;

      const tabs = document.getElementById('tabs');
      const panels = document.getElementById('panels');
      const tabDefs = [{ id: 'overview', label: 'Overview', role: '' }]
        .concat(people.map(p => ({ id: slug(p.name), label: p.name.split(' ')[0], role: p.role, person: p })));

      tabs.innerHTML = tabDefs.map(t =>
        `<button type="button" data-tab="${esc(t.id)}">${esc(t.label)}${t.role ? `<span class="tab-role">${esc(t.role)}</span>` : ''}</button>`).join('');
      panels.innerHTML = tabDefs.map(t => `<section class="panel" id="panel-${esc(t.id)}"></section>`).join('');

      document.getElementById('panel-overview').innerHTML = renderOverview(
        hub, people, slByOwner, spByOwner, mcByOwner, slTargetable, spTargetable, mcTargetable
      );
      document.querySelectorAll('#panel-overview .targetable').forEach(widget => {
        const source = widget.dataset.product === 'Sponsored Listings' ? slTargetable
          : widget.dataset.product === 'Smart Promotions' ? spTargetable
          : mcTargetable;
        wireTargetable(widget, source);
      });
      tabDefs.filter(t => t.person).forEach(t => {
        const panel = document.getElementById('panel-' + t.id);
        panel.dataset.role = t.person.role;
        renderPersonPanel(
          panel,
          hub,
          t.person.name,
          t.person.role,
          slByOwner.get(t.person.name) || [],
          spByOwner.get(t.person.name) || [],
          mcByOwner.get(t.person.name) || []
        );
      });

      tabs.addEventListener('click', e => {
        const b = e.target.closest('button[data-tab]');
        if (b) activateTab(b.dataset.tab);
      });
      const initial = (location.hash || '#overview').slice(1);
      activateTab(tabDefs.some(t => t.id === initial) ? initial : 'overview');
    } catch (err) {
      const boot = document.getElementById('boot');
      if (boot) { boot.className = 'error'; boot.textContent = String(err.message || err); }
    }
  }
  main();
  </script>
